name: Go
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test docs/*.test.mjs
      - run: node --input-type=module --check < docs/project-pages/app.js
